---
- name: Collect inventory data for CMDBuild
  hosts: all
  gather_facts: true
  become: false

  vars:
    cmdbuild_export_dir: /tmp/cmdbuild-export

  pre_tasks:
    - name: Ensure export directory exists on control node
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ cmdbuild_export_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Build CMDBuild inventory payload for this host
      ansible.builtin.set_fact:
        cmdbuild_inventory:
          hostname: "{{ ansible_facts.hostname | default(inventory_hostname) }}"
          fqdn: "{{ ansible_facts.fqdn | default('') }}"
          os_family: "{{ ansible_facts.os_family | default('') }}"
          distribution: "{{ ansible_facts.distribution | default('') }}"
          distribution_version: "{{ ansible_facts.distribution_version | default('') }}"
          kernel: "{{ ansible_facts.kernel | default('') }}"
          architecture: "{{ ansible_facts.architecture | default('') }}"
          ipv4_addresses: "{{ ansible_facts.all_ipv4_addresses | default([]) }}"
          mac_addresses: "{{ ansible_facts.interfaces | default([]) }}"
          cpu_count: "{{ ansible_facts.processor_vcpus | default(ansible_facts.processor_count | default(0)) }}"
          memory_mb: "{{ ansible_facts.memtotal_mb | default(0) }}"
          disk_total_bytes: >-
            {%- set ns = namespace(total=0) -%}
            {%- for device in ansible_facts.devices | default({}) | dict2items -%}
            {%-   if device.key is not match('^(loop|ram|fd|sr|dm-|md|zd|nbd)') -%}
            {%-     set ns.total = ns.total + ((device.value.sectors | default(0) | int) * (device.value.sectorsize | default(0) | int)) -%}
            {%-   endif -%}
            {%- endfor -%}
            {{ ns.total }}
          ansible_host: "{{ ansible_host | default(inventory_hostname) }}"
          last_collected_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          source: "ansible"
          status: "active"

    - name: Write host inventory JSON on control node
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ cmdbuild_export_dir }}/{{ inventory_hostname }}.json"
        content: "{{ cmdbuild_inventory | to_nice_json }}"
        mode: "0644"
