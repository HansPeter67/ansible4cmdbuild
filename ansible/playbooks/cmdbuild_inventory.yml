---
- name: Collect inventory data for CMDBuild
  hosts: all
  gather_facts: true
  become: false

  vars:
    cmdbuild_export_dir: /tmp/cmdbuild-export

  pre_tasks:
    - name: Ensure export directory exists on control node
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ cmdbuild_export_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Build CMDBuild inventory payload for this host
      ansible.builtin.import_tasks: ../tasks/collect_facts.yml

    - name: Write host inventory JSON on control node
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ cmdbuild_export_dir }}/{{ inventory_hostname }}.json"
        content: "{{ cmdbuild_inventory | to_nice_json }}"
        mode: "0644"
